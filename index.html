<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- 拡大は禁止しない（GIGA Standard v5 §2-1）。
       以前は user-scalable=no / maximum-scale=1.0 を付けていたが、
       誤ズーム防止の効果より「見えづらい子が拡大できない」害のほうが大きい。
       誤ズームは CSS の touch-action: manipulation（ダブルタップ拡大の抑止）と、
       カード操作面の touch-action: none で防いでいる。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ===== 中身の取りちがえ・書きかえを防ぐ（CSP。§2-13）=====
       script-src 'self' なので、インラインの <script> と onclick= は動かない。
       このページの JavaScript は すべて外部ファイル（install-hook.js /
       vendor/ / js/）に置いてある。あとから index.html に直接
       <script> を書き足すと、そこだけ黙って動かなくなるので注意すること。

       ※ frame-ancestors（他サイトへの埋め込み禁止）は <meta> では無視され、
         コンソールに警告が出るだけになる。止めるには HTTP ヘッダーが必要だが
         GitHub Pages では足せない。独自ドメインや CDN を挟むときは
         そちら側で frame-ancestors 'self' を設定すること。 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self';
    worker-src 'self';
    manifest-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />

  <title>けいさんカード | GIGA山</title>
  <meta name="description" content="小学1年生の計算カードをデジタルで。順番・バラバラの2モード、タイム計測、スワイプ／キーボードで○×判定。まいにち続けたくなる、れんぞく記録とがんばりカレンダー付き。" />

  <!-- ===== PWA：インストールの合図を いちばん先に うけとる =====
       Chrome（Chromebook をふくむ）は 条件がそろうと すぐに
       beforeinstallprompt を出します。この登録が React などの読みこみより
       あとだと、通信がおそい端末では 合図を とりのがして
       「インストール」ボタンが 出なくなります。そのため いちばん上に置きます。
       CSP に 'unsafe-inline' を足さずに済むよう、インラインではなく
       小さな外部ファイルにして同期読み込みします（§3-2）。 -->
  <script src="./install-hook.js"></script>

  <!-- ===== PWA（アプリとしてインストール／オフライン） ===== -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="color-scheme" content="light" />
  <!-- ホーム画面アイコン -->
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <!-- ⚠️ apple-touch-icon には透明を含む画像を指さないこと。
       iOS は透明部分を黒で埋めるため、ホーム画面でアイコンの四隅だけが黒く出る。
       icons/apple-touch-icon.png は透明を含まない専用画像（180×180）。 -->
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <!-- iOS（Safari）でアプリ風に表示 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="けいさんカード" />

  <!-- ===== Google Fonts =====
       UI・見出し：Zen Kaku Gothic New／計算式・数字：Zen Maru Gothic・Kosugi Maru
       ※ これは「見た目だけ」の依存です（§2-7）。学校のフィルタリングで
         届かなくても、端末側の日本語フォントに落ちるだけでアプリは動きます。
         動かなくなる「実行コード」は CDN から取っていません。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Kosugi+Maru&display=swap" rel="stylesheet" />

  <!-- ===== スタイル（ビルド済み。原本は src/styles.css と tailwind.config.js） ===== -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="root">
    <div class="boot-splash">よみこみ中…</div>
  </div>

  <!-- ===== React 本体（自分側に置いてある。CDN から取らない） =====
       学校のネットワークが unpkg / jsdelivr をふさいでいても起動します。
       原本は node_modules。`npm run build` で vendor/ へコピーされます。 -->
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>

  <!-- ===== 学習ログ（study.v1）=====
       GIGA山の学習アプリ 共通の しくみです。学習の記録を この端末の
       localStorage（`study.records.v1`）に ためるだけで、
       どこかへ 送ることは しません。app.js より 先に 読みこみます。 -->
  <script src="./studyLog.js"></script>

  <!-- ===== アプリ本体（ビルド済み。原本は src/App.jsx） =====
       以前はここで @babel/standalone を使い、ひらくたびに ブラウザの中で
       JSX を翻訳していました。いまは ビルド時に1回だけ翻訳しています。 -->
  <script src="./js/app.js"></script>

  <!-- ===== PWA：Service Worker の登録と 更新のおしらせ ===== -->
  <script src="./js/pwa-boot.js"></script>
</body>
</html>
