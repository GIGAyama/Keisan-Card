<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- favicon の 404 を防ぐ（空アイコン） -->
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>けいさんカード | GIGA山</title>
  <meta name="description" content="小学1年生の計算カードをデジタルで。順番・バラバラの2モード、タイム計測、スワイプ／キーボードで○×判定。" />

  <!-- ===== Google Fonts ===== -->
  <!-- UI・見出し：Zen Kaku Gothic New（落ち着いた角ゴシック） -->
  <!-- 計算式・数字：UDデジタル教科書体（無ければ Zen Maru Gothic にフォールバック） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Kosugi+Maru&display=swap" rel="stylesheet" />

  <!-- ===== Tailwind CSS（CDN版・ビルド不要） ===== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            // ふだんのUI・見出し
            sans: [
              '"Zen Kaku Gothic New"',
              '"Hiragino Kaku Gothic ProN"',
              '"Noto Sans JP"',
              'system-ui',
              'sans-serif',
            ],
            // 計算式・数字（教科書体を最優先）
            textbook: [
              '"UD デジタル 教科書体 NK-R"',
              '"UD Digi Kyokasho NK-R"',
              '"UD Digi Kyokasho N-R"',
              '"Zen Maru Gothic"',
              '"Kosugi Maru"',
              'sans-serif',
            ],
          },
          keyframes: {
            rise: {
              '0%': { transform: 'translateY(8px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            pop: {
              '0%': { transform: 'scale(0.92)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
          },
          animation: {
            rise: 'rise 0.35s ease-out both',
            pop: 'pop 0.25s ease-out both',
          },
        },
      },
    };
  </script>

  <!-- ===== React 本体（CDN版・ビルド不要） ===== -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- ===== Babel（App.jsx をブラウザで翻訳） ===== -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // JSX を従来方式（React.createElement）で変換するプリセット。
    // 自動ランタイムだと出力の先頭に import 文が生成され、
    // モジュールでない <script> として実行されるため
    // 「Cannot use import statement outside a module」エラーになる。
    // classic runtime に固定して import 文の生成を防ぐ。
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets.react, { runtime: 'classic' }]],
    });
  </script>

  <style>
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      /* シンプルで落ち着いた背景 */
      background-color: #f6f7f9;
      color: #0f172a;
      font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    /* 3Dカードめくり用 */
    .flip-perspective { perspective: 1600px; }
    .flip-inner { transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(.2,.8,.2,1); }
    .flip-inner.is-flipped { transform: rotateY(180deg); }
    .flip-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .flip-back { transform: rotateY(180deg); }
    .no-select { -webkit-user-select: none; user-select: none; touch-action: none; }
  </style>
</head>
<body>
  <div id="root">
    <div style="height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;">
      よみこみ中…
    </div>
  </div>

  <!-- ===== アプリ本体。ここだけを編集すれば中身を変えられます ===== -->
  <script type="text/babel" data-presets="react-classic" src="./App.jsx"></script>
</body>
</html>
